services:
  web:
    image: docker.chabokan.net/chabokan/node-manager
    ports:
      - "8123:80"
    volumes:
      - .:/app
      - /home:/home
      - /home2:/home2
      - /storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /backups:/backups
      - type: bind
        source: /root/.docker/config.json
        target: /root/.docker/config.json
        read_only: true
        bind:
          create_host_path: false
    restart: "always"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - node-manager
networks:
  node-manager:
    driver: bridge
